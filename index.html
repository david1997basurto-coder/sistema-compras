<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sistema de Compras Familiar CPB</title>
    <style>
        :root {
            --btn-solicitar: #2bc48a;
            --btn-comprar: #e2e8f0;
            --btn-ajustes: #4a5568;
            --text-light: #ffffff;
        }
        body { font-family: 'Segoe UI', sans-serif; background-size: cover; background-position: center; background-attachment: fixed; background-color: #141b2d; margin: 0; color: var(--text-light); min-height: 100vh; display: flex; justify-content: center; align-items: center; }
        .app-card { width: 100%; max-width: 480px; padding: 20px; text-align: center; position: relative; }
        .top-user-bar { position: absolute; top: -40px; right: 10px; display: flex; gap: 12px; font-size: 14px; font-weight: 600; }
        .avatar-container { width: 110px; height: 110px; border-radius: 50%; border: 3px solid rgba(255,255,255,0.8); margin: 0 auto 15px; overflow: hidden; background: #2d3748; }
        .avatar-container img { width: 100%; height: 100%; object-fit: cover; object-position: top; }
        .btn-cpb { width: 100%; padding: 14px; border: none; border-radius: 25px; font-weight: 600; cursor: pointer; margin-bottom: 14px; transition: 0.2s; }
        .form-box { background: #1e293b; border-radius: 18px; padding: 20px; margin-top: 20px; text-align: left; }
        input { width: 100%; padding: 10px; margin: 5px 0 10px; border-radius: 10px; border: 1px solid #444; background: #2d3748; color: white; box-sizing: border-box; }
        .lista-seccion { margin-top: 15px; max-height: 200px; overflow-y: auto; }
        .compra-tarjeta { background: rgba(255, 255, 255, 0.08); padding: 10px; border-radius: 10px; margin-bottom: 8px; display: flex; justify-content: space-between; font-size: 14px; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div id="login-card" class="app-card">
        <h1 id="txtLoginTitulo">Acceso a la familia CPB</h1>
        <button id="btnLogin" class="btn-cpb" style="background:white; color:black;">Continuar con Google</button>
    </div>

    <div id="portal-card" class="app-card hidden">
        <div class="top-user-bar">
            <span id="userNameField">Usuario</span>
            <span id="btnLogOut" style="cursor:pointer;">↪️</span>
        </div>
        <div class="avatar-container"><img id="imgAvatar" src="perfil.jpg.jpeg" alt="Perfil"></div>
        <h1 id="txtMainTitulo">Sistema de Compras</h1>
        <div id="txtMainSub" style="margin-bottom:20px;">Organiza las compras.</div>
        
        <button id="btnMenuSolicitar" class="btn-cpb" style="background:var(--btn-solicitar);">Solicitar Compra</button>
        <button id="btnMenuComprar" class="btn-cpb" style="background:var(--btn-comprar);">Comprar Ahora</button>
        <button id="btnMenuAjustes" class="btn-cpb" style="background:var(--btn-ajustes); color:white;">Ajustes del Sistema</button>

        <div id="despliegue-solicitud" class="form-box hidden">
            <h3>Nueva Solicitud</h3>
            <input type="text" id="producto" placeholder="Producto">
            <input type="number" id="precio" placeholder="Precio ($)">
            <input type="text" id="fotoUrl" placeholder="Link de imagen">
            <button id="btnGuardarDatos" class="btn-cpb" style="background:var(--btn-solicitar);">Enviar Solicitud</button>
            <div class="lista-seccion" id="historialCompras"></div>
        </div>

        <div id="despliegue-ajustes" class="form-box hidden" style="max-height:400px; overflow-y:auto;">
            <h3>🛠️ Panel de Control Total</h3>
            <label>Título:</label><input type="text" id="cfgTitulo">
            <label>Subtítulo:</label><input type="text" id="cfgSub">
            <label>Link Imagen Fondo:</label><input type="text" id="cfgFondo">
            <label>Link Avatar:</label><input type="text" id="cfgAvatar">
            <label>Btn 1 (Solicitar) Texto:</label><input type="text" id="cfgBtn1Text">
            <label>Btn 1 Color:</label><input type="text" id="cfgBtn1Color">
            <label>Btn 2 (Comprar) Texto:</label><input type="text" id="cfgBtn2Text">
            <label>Btn 3 (Ajustes) Texto:</label><input type="text" id="cfgBtn3Text">
            <button id="btnAplicarCambios" class="btn-cpb" style="background:#10b981;">Guardar Cambios Globales</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
        import { getFirestore, doc, onSnapshot, setDoc, collection, addDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";

        const ADMIN_EMAIL = "david1997basurto@gmail.com"; 
        const firebaseConfig = { apiKey: "AIzaSyDkGmM0hMoOqQ5ughxqiCZxcN3bvlsSltI", authDomain: "gestion-compras-cpb.firebaseapp.com", projectId: "gestion-compras-cpb", storageBucket: "gestion-compras-cpb.firebasestorage.app", messagingSenderId: "643471531807", appId: "1:643471531807:web:9c254668692760ea6a9a2a" };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        // Carga de configuración y datos
        onSnapshot(doc(db, "configuracion", "interfaz"), (s) => {
            if (s.exists()) {
                const c = s.data();
                if(c.titulo) document.getElementById("txtMainTitulo").innerText = c.titulo;
                if(c.subtítulo) document.getElementById("txtMainSub").innerText = c.subtítulo;
                if(c.fondo) document.body.style.backgroundImage = `linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.3)), url('${c.fondo}')`;
                if(c.avatar) document.getElementById("imgAvatar").src = c.avatar;
                if(c.btn1Text) document.getElementById("btnMenuSolicitar").innerText = c.btn1Text;
                if(c.btn1Color) document.getElementById("btnMenuSolicitar").style.backgroundColor = c.btn1Color;
                if(c.btn2Text) document.getElementById("btnMenuComprar").innerText = c.btn2Text;
                if(c.btn3Text) document.getElementById("btnMenuAjustes").innerText = c.btn3Text;
            }
        });

        // Carga de historial de compras
        onSnapshot(query(collection(db, "compras"), orderBy("fecha", "desc")), (snap) => {
            const container = document.getElementById("historialCompras");
            container.innerHTML = "";
            snap.forEach(d => {
                const data = d.data();
                container.innerHTML += `<div class="compra-tarjeta"><span>${data.nombre}</span><span>$${data.monto}</span></div>`;
            });
        });

        onAuthStateChanged(auth, (u) => {
            if (u) {
                document.getElementById("login-card").classList.add("hidden");
                document.getElementById("portal-card").classList.remove("hidden");
                document.getElementById("userNameField").innerText = u.displayName;
            } else {
                document.getElementById("portal-card").classList.add("hidden");
                document.getElementById("login-card").classList.remove("hidden");
            }
        });

        document.getElementById("btnMenuAjustes").addEventListener("click", () => {
            if (auth.currentUser?.email === ADMIN_EMAIL) {
                document.getElementById("despliegue-ajustes").classList.toggle("hidden");
            } else { alert("❌ ACCESO DENEGADO: Módulo exclusivo para David Basurto."); }
        });

        document.getElementById("btnGuardarDatos").addEventListener("click", async () => {
            await addDoc(collection(db, "compras"), { nombre: document.getElementById("producto").value, monto: Number(document.getElementById("precio").value), fecha: new Date() });
            alert("Solicitud Enviada.");
        });

        document.getElementById("btnAplicarCambios").addEventListener("click", async () => {
            await setDoc(doc(db, "configuracion", "interfaz"), {
                titulo: document.getElementById("cfgTitulo").value,
                subtítulo: document.getElementById("cfgSub").value,
                fondo: document.getElementById("cfgFondo").value,
                avatar: document.getElementById("cfgAvatar").value,
                btn1Text: document.getElementById("cfgBtn1Text").value,
                btn1Color: document.getElementById("cfgBtn1Color").value,
                btn2Text: document.getElementById("cfgBtn2Text").value,
                btn3Text: document.getElementById("cfgBtn3Text").value
            }, { merge: true });
            alert("✅ Sistema Actualizado.");
        });

        document.getElementById("btnLogin").addEventListener("click", () => signInWithPopup(auth, provider));
        document.getElementById("btnLogOut").addEventListener("click", () => signOut(auth));
        document.getElementById("btnMenuSolicitar").addEventListener("click", () => document.getElementById("despliegue-solicitud").classList.toggle("hidden"));
    </script>
</body>
</html>
